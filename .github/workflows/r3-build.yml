name: G30D R3I12 observer-reanchored catch compile
on:
  push:
    branches:
      - r3i12-observer-reanchor-20261028
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore reproducible R3 build payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci/r3_payload.tgz.b64 > /tmp/r3_payload.tgz
          mkdir -p /tmp/r3payload
          tar -xzf /tmp/r3_payload.tgz -C /tmp/r3payload
          cp /tmp/r3payload/G30D_R2_changes.patch .
          cp /tmp/r3payload/R3_FROM_R2.patch .
          mkdir -p tools
          cp /tmp/r3payload/build_native.py tools/
          cp /tmp/r3payload/validate_image.py tools/

      - name: Reconstruct exact R3C base
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/Koxx3/SmartESC_STM32_v2.git SOURCE_KOXX3
          git -C SOURCE_KOXX3 checkout --detach 272bdb99d75484dcc377e1cf3e6a20e53a6fd8de
          git -C SOURCE_KOXX3 apply ../G30D_R2_changes.patch
          patch -d SOURCE_KOXX3 -p2 < R3_FROM_R2.patch
          patch -d SOURCE_KOXX3 -p2 < ci/R3A_FIX_FROM_R3.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3B_TIMING_FIX_FROM_R3A.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3C_FROM_R3B.patch
          grep -q 'G30D-FO76-SHADOW-R3C' SOURCE_KOXX3/common_files/src/defines.h
          sed -i 's/FO76_SHADOW_R3/FO76_SHADOW_R3C/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-SHADOW-R3/G30D-FO76-SHADOW-R3C/g' tools/validate_image.py

      - name: Overlay exact R3G source files
        shell: bash
        run: |
          set -euo pipefail
          cat ci/r3g_override.part00 ci/r3g_override.part01 ci/r3g_override.part02 ci/r3g_override.part03 > /tmp/r3g_override.b64
          base64 -d /tmp/r3g_override.b64 > /tmp/R3G_OVERRIDE_FILES.tgz
          echo '42d3cfd176a95a6ad475d614fbeeb278815b43133a27682b6cf38d9e1dbfcb21  /tmp/R3G_OVERRIDE_FILES.tgz' | sha256sum -c -
          tar -xzf /tmp/R3G_OVERRIDE_FILES.tgz -C SOURCE_KOXX3
          grep -q 'G30D-FO76-TAKEOVER-R3G' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'G30_FO76_LAMBDA_PROVEN_UWB 24200u' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'G30_R3G_TAKEOVER_MIN_DPP 64' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'G30_R3G_FALLBACK_MIN_DPP 48' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'G30_R3G_ENTRY_ERR_COUNTS 3641u' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'G30_R3G_FALLBACK_ERR_COUNTS 5461u' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'g30_fo76_control_angle(hElAngle' SOURCE_KOXX3/common_files/src/mc_tasks.c
          grep -q 'g30_fo76_request_takeover(0u)' SOURCE_KOXX3/common_files/src/VescToSTM.c
          grep -q 'g30_takeover' SOURCE_KOXX3/common_files/src/terminal.c
          sed -i 's/FO76_SHADOW_R3C/FO76_TAKEOVER_R3G/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-SHADOW-R3C/G30D-FO76-TAKEOVER-R3G/g' tools/validate_image.py
          sed -i 's/compact FO76 shadow observer; no angle takeover/compact FO76 observer with explicit guarded Hall-to-observer takeover/g' tools/validate_image.py
          sed -i "s/'observer_mode':'shadow_only'/'observer_mode':'guarded_hall_to_observer_takeover'/g" tools/validate_image.py
          patch -d SOURCE_KOXX3 -p1 --dry-run < ci/R3G2_SPEED_SOURCE_FIX.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3G2_SPEED_SOURCE_FIX.patch
          grep -q 'G30D-FO76-TAKEOVER-R3G2' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'hElSpeedDpp = SPD_GetElSpeedDpp(speedHandle);' SOURCE_KOXX3/common_files/src/mc_tasks.c
          sed -i 's/FO76_TAKEOVER_R3G/FO76_TAKEOVER_R3G2/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-TAKEOVER-R3G/G30D-FO76-TAKEOVER-R3G2/g' tools/validate_image.py
          python3 ci/apply_r3h.py
          grep -q 'G30D-FO76-OBSERVER-ONLY-R3H' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'G30_R3H_OBSERVER_COAST_MIN_DPP 64' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'hall_speed_dpp<=-(int16_t)G30_R3G_TAKEOVER_MIN_DPP' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'g30_fo76_coast_requested()' SOURCE_KOXX3/common_files/src/mc_tasks.c
          sed -i 's/FO76_TAKEOVER_R3G2/FO76_OBSERVER_ONLY_R3H/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-TAKEOVER-R3G2/G30D-FO76-OBSERVER-ONLY-R3H/g' tools/validate_image.py
          python3 ci/apply_r3i.py
          grep -q 'G30D-FO76-PUSHSTART-R3I' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'PB1 = BEMF_C / ADC9' SOURCE_KOXX3/g30p/Src/stm32f1xx_hal_msp.c
          grep -q 'g30_r3i_block_pwm_start()' SOURCE_KOXX3/common_files/src/VescToSTM.c
          grep -q 'g30_fo76_sensorless_seed' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'g30_pushstart' SOURCE_KOXX3/common_files/src/terminal.c
          sed -i 's/FO76_OBSERVER_ONLY_R3H/FO76_PUSHSTART_R3I/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-OBSERVER-ONLY-R3H/G30D-FO76-PUSHSTART-R3I/g' tools/validate_image.py
          python3 ci/apply_r3i2.py
          grep -q 'G30D-FO76-PUSHSTART-R3I2' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'R3I2 ARM: forced MCSDK STOP + PWM OFF' SOURCE_KOXX3/common_files/src/terminal.c
          grep -q 'g30_r3i_start_pending() && StateM1==IDLE' SOURCE_KOXX3/common_files/src/mc_tasks.c
          grep -q 'VescToSTM_prepare_sensorless_start' SOURCE_KOXX3/common_files/src/mc_tasks.c
          sed -i 's/FO76_PUSHSTART_R3I/FO76_PUSHSTART_R3I2/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I/G30D-FO76-PUSHSTART-R3I2/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i2_pushstart_test.py
          python3 ci/apply_r3i3.py
          grep -q 'G30D-FO76-PUSHSTART-R3I3' SOURCE_KOXX3/common_files/src/defines.h
          grep -q '#define RCM_MAX_CONV  5' SOURCE_KOXX3/common_files/src/regular_conversion_manager.c
          grep -q 'adc_ready=%u handles=%u,%u,%u' SOURCE_KOXX3/common_files/src/terminal.c
          sed -i 's/FO76_PUSHSTART_R3I2/FO76_PUSHSTART_R3I3/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I2/G30D-FO76-PUSHSTART-R3I3/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i3_pushstart_test.py
          python3 ci/apply_r3i5.py
          grep -q 'G30D-FO76-PUSHSTART-R3I5' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'R3I5 ARM: keep MCSDK RUN, force PWM OFF for coast' SOURCE_KOXX3/common_files/src/terminal.c
          grep -q 'g30_r3i_start_pending() && StateM1==RUN' SOURCE_KOXX3/common_files/src/mc_tasks.c
          sed -i 's/FO76_PUSHSTART_R3I3/FO76_PUSHSTART_R3I5/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I3/G30D-FO76-PUSHSTART-R3I5/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i5_pushstart_test.py
          python3 ci/apply_r3i6.py
          grep -q 'G30D-FO76-PUSHSTART-R3I6' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'G30_R3I6_CATCH_GOOD_1K 20u' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'sensorless_catch_state=1u' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'catch state=%u phase=%u err=%d ticks=%u' SOURCE_KOXX3/common_files/src/terminal.c
          sed -i 's/FO76_PUSHSTART_R3I5/FO76_PUSHSTART_R3I6/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I5/G30D-FO76-PUSHSTART-R3I6/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i6_pushstart_test.py
          python3 ci/apply_r3i7.py
          grep -q 'G30D-FO76-PUSHSTART-R3I7' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'sensorless_catch_step_q4=(int16_t)((int32_t)sensorless_catch_step_q4 + diff/4);' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'if(!takeover_coast_request) takeover_latch_coast' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'R3I7 ARM: PWM blocked; IDLE auto-restarts at zero' SOURCE_KOXX3/common_files/src/terminal.c
          grep -q 'catch state=%u phase=%u err=%d ticks=%u step_q4=%d' SOURCE_KOXX3/common_files/src/terminal.c
          sed -i 's/FO76_PUSHSTART_R3I6/FO76_PUSHSTART_R3I7/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I6/G30D-FO76-PUSHSTART-R3I7/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i7_pushstart_test.py
          python3 ci/apply_r3i8.py
          grep -q 'G30D-FO76-PUSHSTART-R3I8' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'vbus_now=%ld adc_vbus=%u' SOURCE_KOXX3/common_files/src/terminal.c
          sed -i 's/FO76_PUSHSTART_R3I7/FO76_PUSHSTART_R3I8/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I7/G30D-FO76-PUSHSTART-R3I8/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i8_pushstart_test.py
          python3 ci/apply_r3i9.py
          grep -q 'G30D-FO76-PUSHSTART-R3I9' SOURCE_KOXX3/common_files/src/defines.h
          grep -q '(uint16_t)HALL_M1.MeasuredElAngle' SOURCE_KOXX3/common_files/src/mc_tasks.c
          grep -q 'last_cal_hall_valid || hall_angle!=last_cal_hall' SOURCE_KOXX3/common_files/src/g30_r3i_pushstart.c
          sed -i 's/FO76_PUSHSTART_R3I8/FO76_PUSHSTART_R3I9/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I8/G30D-FO76-PUSHSTART-R3I9/g' tools/validate_image.py
          python3 -m py_compile ci/g30_r3i9_pushstart_test.py
          patch -d SOURCE_KOXX3 -p1 --dry-run < ci/R3I10_FROM_R3I9.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3I10_FROM_R3I9.patch
          grep -q 'G30D-FO76-PUSHSTART-R3I10' SOURCE_KOXX3/common_files/src/defines.h
          patch -d SOURCE_KOXX3 -p1 --dry-run < ci/R3I11_FROM_R3I10.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3I11_FROM_R3I10.patch
          grep -q 'G30D-FO76-PUSHSTART-R3I11' SOURCE_KOXX3/common_files/src/defines.h
          patch -d SOURCE_KOXX3 -p1 --dry-run < ci/R3I12_FROM_R3I11.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3I12_FROM_R3I11.patch
          sed -i 's/G30D-FO76-PUSHSTART-R3I11/G30D-FO76-PUSHSTART-R3I12/g' SOURCE_KOXX3/common_files/src/defines.h
          sed -i 's/FO76_R3I11/FO76_R3I12/g; s/R3I11 preload/R3I12 preload/g; s/R3I11 ARM:/R3I12 ARM:/g' SOURCE_KOXX3/common_files/src/terminal.c
          grep -q 'G30D-FO76-PUSHSTART-R3I12' SOURCE_KOXX3/common_files/src/defines.h
          grep -q 'sensorless_catch_phase_q4=((int32_t)(uint16_t)obs_pred)<<4;' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'catch_phase=obs_pred;' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          grep -q 'sensorless_catch_error=0;' SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c

      - name: Install ARM GNU GCC 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1
          FILE=xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
          curl -fL "$URL/$FILE" -o "/tmp/$FILE"
          curl -fL "$URL/$FILE.sha" -o "/tmp/$FILE.sha"
          cd /tmp
          sha256sum -c "$FILE.sha"
          tar -xzf "$FILE"
          echo "/tmp/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"

      - name: Compile and validate R3I12
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version
          sed -i 's/FO76_PUSHSTART_R3I9/FO76_PUSHSTART_R3I12/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I9/G30D-FO76-PUSHSTART-R3I12/g' tools/validate_image.py
          mkdir -p OUTPUT
          python3 tools/build_native.py | tee OUTPUT/build.log
          python3 tools/validate_image.py | tee OUTPUT/validation.log
          BIN=OUTPUT/SmartESC_v2_G30D_FO76_PUSHSTART_R3I12_STLINK_APP_0x08001000.bin
          ELF=OUTPUT/SmartESC_v2_G30D_FO76_PUSHSTART_R3I12.elf
          sha256sum "$BIN" > OUTPUT/SHA256_BIN.txt
          arm-none-eabi-size "$ELF" > OUTPUT/SIZE.txt
          arm-none-eabi-nm -S --size-sort "$ELF" | tail -40 > OUTPUT/LARGEST_SYMBOLS.txt
          tar -czf OUTPUT/SOURCE_KOXX3_R3I12_EXACT.tgz SOURCE_KOXX3
          cp ci/R3I12_FROM_R3I11.patch OUTPUT/
          python3 - <<'PY' | tee OUTPUT/R3I12_STATIC_GATES.txt
          from pathlib import Path
          sh=Path('SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c').read_text()
          de=Path('SOURCE_KOXX3/common_files/src/defines.h').read_text()
          gates={
            'build_id':'G30D-FO76-PUSHSTART-R3I12' in de,
            'catch_reanchors_to_observer':'sensorless_catch_phase_q4=((int32_t)(uint16_t)obs_pred)<<4;' in sh,
            'control_uses_obs_pred':'catch_phase=obs_pred;' in sh and 'takeover_control_phase=catch_phase;' in sh,
            'catch_error_zero_after_reanchor':'sensorless_catch_error=0;' in sh,
            'old_independent_entry_gate_removed':'abs_phase16(sensorless_catch_error)<G30_R3G_ENTRY_ERR_COUNTS' not in sh,
            'timeout_retained':'G30_R3I6_CATCH_TIMEOUT_FOC' in sh,
            'coast_retained':'takeover_latch_coast(G30_TK_FB_INVALID)' in sh,
            'lambda_retained':'G30_FO76_LAMBDA_PROVEN_UWB 24200u' in sh,
          }
          for k,v in gates.items(): print(f'{k}={int(v)}')
          assert all(gates.values()), gates
          print('R3I12_STATIC_GATES=PASS')
          PY

      - name: Upload R3I12 candidate
        uses: actions/upload-artifact@v4
        with:
          name: G30D_R3I12_PUSHSTART_COMPILED
          if-no-files-found: error
          retention-days: 7
          path: |
            OUTPUT/SmartESC_v2_G30D_FO76_PUSHSTART_R3I12.elf
            OUTPUT/SmartESC_v2_G30D_FO76_PUSHSTART_R3I12.map
            OUTPUT/SmartESC_v2_G30D_FO76_PUSHSTART_R3I12_STLINK_APP_0x08001000.bin
            OUTPUT/SmartESC_v2_G30D_FO76_PUSHSTART_R3I12_STLINK_APP_0x08001000.hex
            OUTPUT/VERIFICATION.json
            OUTPUT/SHA256_BIN.txt
            OUTPUT/SIZE.txt
            OUTPUT/LARGEST_SYMBOLS.txt
            OUTPUT/SOURCE_KOXX3_R3I12_EXACT.tgz
            OUTPUT/APPLY_R3I12_EXACT.py
            OUTPUT/R3I12_BUILD_WORKFLOW.yml
            OUTPUT/R3I12_STATIC_GATES.txt
            ci/g30_r3i9_pushstart_test.py
            ci/01_AUTO_R3I12_TWO_PUSH_TEST.cmd
            OUTPUT/build.log
            OUTPUT/compile.log
            OUTPUT/validation.log
