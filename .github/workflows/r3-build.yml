name: G30D R3G source reconstruction
on:
  push:
    branches:
      - r3g-build-20261027
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore R3 build payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci/r3_payload.tgz.b64 > /tmp/r3_payload.tgz
          mkdir -p /tmp/r3payload
          tar -xzf /tmp/r3_payload.tgz -C /tmp/r3payload
          cp /tmp/r3payload/G30D_R2_changes.patch .
          cp /tmp/r3payload/R3_FROM_R2.patch .
          mkdir -p tools
          cp /tmp/r3payload/build_native.py tools/
          cp /tmp/r3payload/validate_image.py tools/

      - name: Reconstruct R2 through R3C
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/Koxx3/SmartESC_STM32_v2.git SOURCE_KOXX3
          git -C SOURCE_KOXX3 checkout --detach 272bdb99d75484dcc377e1cf3e6a20e53a6fd8de
          git -C SOURCE_KOXX3 apply ../G30D_R2_changes.patch
          patch -d SOURCE_KOXX3 -p2 < R3_FROM_R2.patch
          patch -d SOURCE_KOXX3 -p2 < ci/R3A_FIX_FROM_R3.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3B_TIMING_FIX_FROM_R3A.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3C_FROM_R3B.patch

      - name: Dump reconstructed R3C source
        shell: bash
        run: |
          set -euo pipefail
          echo '===== defines.h ====='
          sed -n '1,40p' SOURCE_KOXX3/common_files/src/defines.h
          echo '===== g30_fo76_shadow.h ====='
          cat SOURCE_KOXX3/common_files/src/g30_fo76_shadow.h
          echo '===== g30_fo76_shadow.c ====='
          cat SOURCE_KOXX3/common_files/src/g30_fo76_shadow.c
          echo '===== mc_tasks.c relevant ====='
          sed -n '760,850p' SOURCE_KOXX3/common_files/src/mc_tasks.c
          echo '===== terminal.c relevant ====='
          sed -n '60,150p' SOURCE_KOXX3/common_files/src/terminal.c
