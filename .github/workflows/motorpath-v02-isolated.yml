          grep -q 'if(!g30_fo76_coast_requested()) return;' SOURCE_KOXX3/common_files/src/VescToSTM.c
          grep -q 'if(STM_GetState(&STM\[M1\])==IDLE)' SOURCE_KOXX3/common_files/src/VescToSTM.c

      - name: Add telemetry-only HF4 dashboard link and run captured-frame regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply_hf4_dash_link_r1.py SOURCE_KOXX3
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Ici/hf4_dash_link_r1 ci/hf4_dash_link_r1/test_hf4_dash_proto.c -o /tmp/hf4_dash_proto_test
          ASAN_OPTIONS=detect_leaks=0 /tmp/hf4_dash_proto_test | tee OUTPUT/DASH_R1_HOST_TESTS.txt

