          grep -q 'G30D-R3I23-STARTUP-TORQUE-RAMP' SOURCE_KOXX3/common_files/src/defines.h
          patch -d SOURCE_KOXX3 -p1 --dry-run < ci/R3I23_HS1_DUALMODE_FROM_R3I23.patch
          patch -d SOURCE_KOXX3 -p1 < ci/R3I23_HS1_DUALMODE_FROM_R3I23.patch
          grep -q 'G30D-R3I23-HS1-DUALMODE' SOURCE_KOXX3/common_files/src/defines.h
