      - name: Install ARM GNU GCC 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1
          FILE=xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
          curl -fL "$URL/$FILE" -o "/tmp/$FILE"
          curl -fL "$URL/$FILE.sha" -o "/tmp/$FILE.sha"
          cd /tmp
          sha256sum -c "$FILE.sha"
          tar -xzf "$FILE"
          echo "/tmp/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"

      - name: Compile and validate SESC Motorpath Audit V0.2
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version
          sed -i 's/FO76_PUSHSTART_R3I9/SESC_MOTORPATH_AUDIT_V02/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-PUSHSTART-R3I9/SESC-MOTORPATH-AUDIT-V0.2/g' tools/validate_image.py
          mkdir -p OUTPUT
          python3 tools/build_native.py | tee OUTPUT/build.log
          python3 tools/validate_image.py | tee OUTPUT/validation.log
          BIN=OUTPUT/SmartESC_v2_G30D_SESC_MOTORPATH_AUDIT_V02_STLINK_APP_0x08001000.bin
          ELF=OUTPUT/SmartESC_v2_G30D_SESC_MOTORPATH_AUDIT_V02.elf
          sha256sum "$BIN" > OUTPUT/SHA256_BIN.txt
          arm-none-eabi-size "$ELF" > OUTPUT/SIZE.txt
          python3 - <<'PY'
          from pathlib import Path
          parts=Path('OUTPUT/SIZE.txt').read_text().splitlines()[-1].split()
          text,data,bss=map(int,parts[:3])
          ram=data+bss
          flash=text+data
          print(f'SESC_MOTORPATH_AUDIT_V02_FLASH={flash} SESC_MOTORPATH_AUDIT_V02_RAM={ram}')
          assert ram <= 20480, f'RAM overflow: {ram} > 20480'
          assert flash <= 118784, f'APP flash overflow: {flash} > 118784'
          Path('OUTPUT/MEMORY_GATE.txt').write_text(f'FLASH={flash}/118784\nRAM={ram}/20480\nPASS\n')
          PY
          arm-none-eabi-nm -S --size-sort "$ELF" | tail -40 > OUTPUT/LARGEST_SYMBOLS.txt
          tar --exclude='SOURCE_KOXX3/.git' -czf OUTPUT/SOURCE_KOXX3_SESC_MOTORPATH_AUDIT_V02_EXACT.tgz SOURCE_KOXX3
