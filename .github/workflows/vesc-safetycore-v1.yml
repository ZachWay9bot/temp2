name: SESC POWERCORE6500 VESC SAFETYCORE V1

on:
  push:
    branches:
      - vesc-safetycore-v1-20261106
    paths:
      - 'ci/sesc_vesc_safetycore_v1.patch'
      - 'ci/test_sesc_vesc_safetycore_v1.py'
      - '.github/workflows/vesc-safetycore-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact VBUS FUSION LIVE SHADOW V1 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13510673322/zip > /tmp/parent.zip
          mkdir -p /tmp/parent
          unzip -q /tmp/parent.zip -d /tmp/parent
          test -f /tmp/parent/OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VBUS_FUSION_LIVE_SHADOW_V1_EXACT.tgz
          tar -xzf /tmp/parent/OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VBUS_FUSION_LIVE_SHADOW_V1_EXACT.tgz
          grep -q 'SESC-DRV126-POWERCORE6500-VBUS-FUSION-LIVE-SHADOW-V1' SOURCE_KOXX3/common_files/src/defines.h
          base64 -d ci/r3_payload.tgz.b64 > /tmp/r3_payload.tgz
          mkdir -p /tmp/r3payload tools OUTPUT
          tar -xzf /tmp/r3_payload.tgz -C /tmp/r3payload
          cp /tmp/r3payload/build_native.py tools/
          cp /tmp/r3payload/validate_image.py tools/
          printf '%s\n' \
            'parent_run=42234042712' \
            'parent_artifact=13510673322' \
            'parent_build=SESC-DRV126-POWERCORE6500-VBUS-FUSION-LIVE-SHADOW-V1' \
            'parent_bin_sha256=5584fc35e544d93efcc184e37f2b710d934554296d0b166826e6359b0c1479b0' \
            > OUTPUT/PARENT_PROVENANCE.txt

      - name: Apply VESC safety core and run source/host tests
        shell: bash
        run: |
          set -euo pipefail
          patch -p0 < ci/sesc_vesc_safetycore_v1.patch
          python3 ci/test_sesc_vesc_safetycore_v1.py | tee OUTPUT/VESC_SAFETYCORE_V1_STATIC_TESTS.txt
          cc -std=c11 -Wall -Wextra -Werror -I SOURCE_KOXX3/common_files/src ci/test_g30_vbus_fusion.c -o /tmp/vbfus_test
          /tmp/vbfus_test | tee OUTPUT/VESC_SAFETYCORE_V1_VBUS_POLICY_TESTS.txt

      - name: Install ARM GNU GCC 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1
          FILE=xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
          curl -fL "$URL/$FILE" -o "/tmp/$FILE"
          curl -fL "$URL/$FILE.sha" -o "/tmp/$FILE.sha"
          cd /tmp
          sha256sum -c "$FILE.sha"
          tar -xzf "$FILE"
          echo "/tmp/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"

      - name: Compile and validate safety-core build
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/FO76_SHADOW_R3/SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-SHADOW-R3/SESC-DRV126-POWERCORE6500-VESC-SAFETYCORE-V1/g' tools/validate_image.py
          python3 tools/build_native.py | tee OUTPUT/build.log
          python3 tools/validate_image.py | tee OUTPUT/validation.log
          BIN=OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1_STLINK_APP_0x08001000.bin
          ELF=OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1.elf
          test -f "$BIN"
          test -f "$ELF"
          sha256sum "$BIN" | tee OUTPUT/SHA256_BIN.txt
          arm-none-eabi-size "$ELF" | tee OUTPUT/SIZE.txt
          python3 - <<'PY'
          from pathlib import Path
          parts=Path('OUTPUT/SIZE.txt').read_text().splitlines()[-1].split()
          text,data,bss=map(int,parts[:3])
          flash=text+data; ram=data+bss
          assert flash <= 118784,(flash,118784)
          assert ram <= 20480,(ram,20480)
          Path('OUTPUT/MEMORY_GATE.txt').write_text(f'FLASH={flash}/118784\nRAM={ram}/20480\nPASS\n')
          print(f'FLASH={flash}/118784 RAM={ram}/20480 PASS')
          PY
          arm-none-eabi-nm -S --size-sort "$ELF" | tail -40 > OUTPUT/LARGEST_SYMBOLS.txt
          tar --exclude='SOURCE_KOXX3/.git' -czf OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1_EXACT.tgz SOURCE_KOXX3

      - name: Post-build invariants and binary protection proof
        shell: bash
        run: |
          set -euo pipefail
          ELF=OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1.elf
          test -s OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1_EXACT.tgz
          arm-none-eabi-objdump -d --disassemble=R3_2_GetPhaseCurrents "$ELF" > OUTPUT/DISASM_OCP.txt
          arm-none-eabi-objdump -d --disassemble=R3_2_SwitchOnPWM "$ELF" > OUTPUT/DISASM_SWITCH_ON.txt
          cat OUTPUT/DISASM_OCP.txt
          cat OUTPUT/DISASM_SWITCH_ON.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("SOURCE_KOXX3")
          de=(root/"common_files/src/defines.h").read_text()
          vs=(root/"common_files/src/VescToSTM.c").read_text()
          mc=(root/"common_files/src/mc_tasks.c").read_text()
          cf=(root/"common_files/src/conf_general.c").read_text()
          pr=(root/"common_files/inc/product.h").read_text()
          pw=(root/"common_files/MotorControl/MCSDK/MCLib/F1xx/Src/r3_2_f1xx_pwm_curr_fdbk.c").read_text()
          assert "SESC-DRV126-POWERCORE6500-VESC-SAFETYCORE-V1" in de
          assert "#define G30_VESC_SAFETYCORE_V1 1" in de
          assert "10.0f * CURRENT_FACTOR_A" in cf
          assert "OverCurrentCycles = 0" in cf
          assert "#ifdef G30P\n#define AUTO_RESET_FAULT 0" in pr
          assert "VescToSTM_get_bus_voltage()>45.0f" in vs
          assert "MCI_FaultAcknowledged(pMCI[M1])" in vs
          assert "g30_pa1_trust_counts" in mc
          assert "(ia_oc > oc)" in pw and "(ib_oc > oc)" in pw and "(ic_oc > oc)" in pw
          oc=Path("OUTPUT/DISASM_OCP.txt").read_text()
          sw=Path("OUTPUT/DISASM_SWITCH_ON.txt").read_text()
          assert "<R3_2_GetPhaseCurrents>:" in oc
          assert "R3_2_SwitchOffPWM" in oc, "compiled OCP path no longer reaches PWM-off"
          assert "<R3_2_SwitchOnPWM>:" in sw
          assert re.search(r"\borr(?:\.w)?\s+[^\n]*#(?:32768|0x8000)\b",sw), "motor build cannot enable TIM1 MOE"
          Path("OUTPUT/POST_BUILD_INVARIANTS.txt").write_text(
              "SOURCE_SAFETY_CONTRACT=PASS\n"
              "BINARY_OCP_TO_PWM_OFF=PASS\n"
              "BINARY_MOTOR_PWM_ENABLE_PRESENT=PASS\n")
          print("SOURCE_SAFETY_CONTRACT=PASS BINARY_OCP_TO_PWM_OFF=PASS BINARY_MOTOR_PWM_ENABLE_PRESENT=PASS")
          PY

      - name: Upload VESC safety-core build
        uses: actions/upload-artifact@v4
        with:
          name: G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1_COMPILED
          retention-days: 30
          if-no-files-found: error
          path: |
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1_STLINK_APP_0x08001000.bin
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1.hex
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1.elf
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1.map
            OUTPUT/SHA256_BIN.txt
            OUTPUT/SIZE.txt
            OUTPUT/MEMORY_GATE.txt
            OUTPUT/LARGEST_SYMBOLS.txt
            OUTPUT/validation.log
            OUTPUT/build.log
            OUTPUT/PARENT_PROVENANCE.txt
            OUTPUT/VESC_SAFETYCORE_V1_STATIC_TESTS.txt
            OUTPUT/VESC_SAFETYCORE_V1_VBUS_POLICY_TESTS.txt
            OUTPUT/POST_BUILD_INVARIANTS.txt
            OUTPUT/DISASM_OCP.txt
            OUTPUT/DISASM_SWITCH_ON.txt
            OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VESC_SAFETYCORE_V1_EXACT.tgz
            ci/sesc_vesc_safetycore_v1.patch
            ci/test_sesc_vesc_safetycore_v1.py
            ci/test_g30_vbus_fusion.c
