name: SESC POWERCORE6500 SAFETY DIAG LOCKED V11

on:
  push:
    branches:
      - vbus-safety-diag-locked-v11-20261106
    paths:
      - 'ci/apply_sesc_vbus_safety_diag_locked_v11.py'
      - 'ci/test_sesc_vbus_safety_diag_locked_v11.py'
      - '.github/workflows/vbus-safety-diag-locked-v11.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact VBUS FUSION LIVE SHADOW V1 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13510673322/zip > /tmp/parent.zip
          mkdir -p /tmp/parent
          unzip -q /tmp/parent.zip -d /tmp/parent
          test -f /tmp/parent/OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VBUS_FUSION_LIVE_SHADOW_V1_EXACT.tgz
          tar -xzf /tmp/parent/OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VBUS_FUSION_LIVE_SHADOW_V1_EXACT.tgz
          grep -q 'SESC-DRV126-POWERCORE6500-VBUS-FUSION-LIVE-SHADOW-V1' SOURCE_KOXX3/common_files/src/defines.h
          base64 -d ci/r3_payload.tgz.b64 > /tmp/r3_payload.tgz
          mkdir -p /tmp/r3payload tools OUTPUT
          tar -xzf /tmp/r3_payload.tgz -C /tmp/r3payload
          cp /tmp/r3payload/build_native.py tools/
          cp /tmp/r3payload/validate_image.py tools/
          printf '%s\n' \
            'parent_run=42234042712' \
            'parent_artifact=13510673322' \
            'parent_build=SESC-DRV126-POWERCORE6500-VBUS-FUSION-LIVE-SHADOW-V1' \
            'parent_bin_sha256=5584fc35e544d93efcc184e37f2b710d934554296d0b166826e6359b0c1479b0' \
            > OUTPUT/PARENT_PROVENANCE.txt

      - name: Apply V11 hard-lock and run source/host tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply_sesc_vbus_safety_diag_locked_v11.py
          python3 ci/test_sesc_vbus_safety_diag_locked_v11.py | tee OUTPUT/VBUS_SAFETY_DIAG_LOCKED_V11_STATIC_TESTS.txt
          cc -std=c11 -Wall -Wextra -Werror -I SOURCE_KOXX3/common_files/src ci/test_g30_vbus_fusion.c -o /tmp/vbfus_test
          /tmp/vbfus_test | tee OUTPUT/VBUS_SAFETY_DIAG_LOCKED_V11_POLICY_TESTS.txt

      - name: Install ARM GNU GCC 13.2.1
        shell: bash
        run: |
          set -euo pipefail
          URL=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1
          FILE=xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz
          curl -fL "$URL/$FILE" -o "/tmp/$FILE"
          curl -fL "$URL/$FILE.sha" -o "/tmp/$FILE.sha"
          cd /tmp
          sha256sum -c "$FILE.sha"
          tar -xzf "$FILE"
          echo "/tmp/xpack-arm-none-eabi-gcc-13.2.1-1.1/bin" >> "$GITHUB_PATH"

      - name: Compile and validate live-shadow build
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/FO76_SHADOW_R3/SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11/g' tools/build_native.py tools/validate_image.py
          sed -i 's/G30D-FO76-SHADOW-R3/SESC-DRV126-POWERCORE6500-SAFETY-DIAG-LOCKED-V11/g' tools/validate_image.py
          python3 tools/build_native.py | tee OUTPUT/build.log
          python3 tools/validate_image.py | tee OUTPUT/validation.log
          BIN=OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11_STLINK_APP_0x08001000.bin
          ELF=OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11.elf
          test -f "$BIN"
          test -f "$ELF"
          sha256sum "$BIN" | tee OUTPUT/SHA256_BIN.txt
          arm-none-eabi-size "$ELF" | tee OUTPUT/SIZE.txt
          python3 - <<'PY'
          from pathlib import Path
          parts=Path('OUTPUT/SIZE.txt').read_text().splitlines()[-1].split()
          text,data,bss=map(int,parts[:3])
          flash=text+data; ram=data+bss
          assert flash <= 118784,(flash,118784)
          assert ram <= 20480,(ram,20480)
          Path('OUTPUT/MEMORY_GATE.txt').write_text(f'FLASH={flash}/118784\nRAM={ram}/20480\nPASS\n')
          print(f'FLASH={flash}/118784 RAM={ram}/20480 PASS')
          PY
          arm-none-eabi-nm -S --size-sort "$ELF" | tail -40 > OUTPUT/LARGEST_SYMBOLS.txt
          tar --exclude='SOURCE_KOXX3/.git' -czf OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11_EXACT.tgz SOURCE_KOXX3

      - name: Post-build invariants and actual ARM binary MOE lock check
        shell: bash
        run: |
          set -euo pipefail
          ELF=OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11.elf
          arm-none-eabi-objdump -d --disassemble=R3_2_TurnOnLowSides "$ELF" > OUTPUT/DISASM_LOW_SIDES.txt
          arm-none-eabi-objdump -d --disassemble=R3_2_SwitchOnPWM "$ELF" > OUTPUT/DISASM_SWITCH_ON.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("SOURCE_KOXX3")
          de=(root/"common_files/src/defines.h").read_text()
          assert "SESC-DRV126-POWERCORE6500-SAFETY-DIAG-LOCKED-V11" in de
          p=(root/"common_files/MotorControl/MCSDK/MCLib/F1xx/Src/r3_2_f1xx_pwm_curr_fdbk.c").read_text()
          assert p.count("#ifdef G30P")>=2
          assert "G30_BMS_BATTERY_SAFE_POWERLOCK" not in p
          for n,file in [("R3_2_TurnOnLowSides","OUTPUT/DISASM_LOW_SIDES.txt"),
                         ("R3_2_SwitchOnPWM","OUTPUT/DISASM_SWITCH_ON.txt")]:
              asm=Path(file).read_text()
              assert "<"+n+">:" in asm,(n,"function missing")
              lines=asm.splitlines()
              instr=[x for x in lines if re.match(r"\s*[0-9a-f]+:\s+[0-9a-f ]+\s+\S+",x)]
              assert 4<len(instr)<140,(n,len(instr))
              # Original power-unsafe binaries include 'orr ... #32768' to enable MOE;
              # the locked functions must contain only a MOE-clearing instruction.
              bad=re.findall(r"\borr(?:\.w)?\s+[^\n]*#(?:32768|0x8000)\b",asm)
              assert not bad,(n,"MOE set in compiled binary",bad)
              assert re.search(r"\bbic(?:\.w)?\s+[^\n]*#(?:32768|0x8000)\b",asm),(n,"MOE clear missing",asm)
          Path("OUTPUT/POST_BUILD_INVARIANTS.txt").write_text("SOURCE_GUARD=PASS\nBINARY_PWM_MOE_OFF=PASS\n")
          print("SOURCE_GUARD=PASS BINARY_PWM_MOE_OFF=PASS")
          PY

      - name: Upload V11 locked diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11_COMPILED
          retention-days: 30
          if-no-files-found: error
          path: |
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11_STLINK_APP_0x08001000.bin
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11.hex
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11.elf
            OUTPUT/SmartESC_v2_G30D_SESC_DRV126_POWERCORE6500_SAFETY_DIAG_LOCKED_V11.map
            OUTPUT/SHA256_BIN.txt
            OUTPUT/SIZE.txt
            OUTPUT/MEMORY_GATE.txt
            OUTPUT/LARGEST_SYMBOLS.txt
            OUTPUT/validation.log
            OUTPUT/build.log
            OUTPUT/PARENT_PROVENANCE.txt
            OUTPUT/VBUS_SAFETY_DIAG_LOCKED_V11_STATIC_TESTS.txt
            OUTPUT/VBUS_SAFETY_DIAG_LOCKED_V11_POLICY_TESTS.txt
            OUTPUT/POST_BUILD_INVARIANTS.txt
            OUTPUT/DISASM_LOW_SIDES.txt
            OUTPUT/DISASM_SWITCH_ON.txt
            OUTPUT/SOURCE_KOXX3_SESC_DRV126_POWERCORE6500_VBUS_FUSION_LIVE_SHADOW_V1_EXACT.tgz
            ci/apply_sesc_vbus_safety_diag_locked_v11.py
            ci/test_sesc_vbus_safety_diag_locked_v11.py
            ci/test_g30_vbus_fusion.c
