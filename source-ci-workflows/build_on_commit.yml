name: Build G30 Bench UART-IAP on commit

on:
  push:
    branches: [ vesc_comp ]
    paths:
      - 'g30p/**'
      - 'common_files/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ vesc_comp ]
    paths:
      - 'g30p/**'
      - 'common_files/**'
      - 'tools/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  g30:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build G30P
        uses: docker://wsbu/stm32cubeide:latest
        with:
          entrypoint: /opt/stm32cubeide/stm32cubeide
          args: --launcher.suppressErrors -nosplash -application org.eclipse.cdt.managedbuilder.core.headlessbuild -build g30p/Debug -importAll /github/workspace/

      - name: Audit linked G30 SRAM allocation (read only)
        run: |
          python3 tools/audit_g30_ram.py \
            --elf g30p/STM32CubeIDE/Debug/g30p.elf \
            --json-out g30-ram-audit.json

      # Review known FreeRTOS allocations WITHOUT modifying firmware.
      # Unguarded sites are reported as findings; no live heap claim.
      - name: Audit G30 FreeRTOS heap allocation paths (read only)
        run: |
          python3 tools/audit_g30_heap_paths.py --json-out g30-heap-audit.json

      # Current development bench has no dashboard: build an encrypted UART
      # IAP test payload, reusing the *unchanged* NinebotTEA encoding.
      # This creates artifacts only; it never flashes hardware or publishes
      # firmware into the repository/default branch.
      - name: Build BENCH UART-IAP candidate (no SHU)
        run: |
          python3 tools/make_bench_iap.py \
            g30p/STM32CubeIDE/Debug/g30p.bin \
            SmartESC_G30_BENCH_IAP_Driver.bin \
            --manifest SmartESC_G30_BENCH_MANIFEST.json
          {
            echo "BENCH TEST CANDIDATE - NOT MOTOR TESTED"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Build: ${GITHUB_RUN_ID}"
            echo "Date UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Format: encrypted UART-IAP Driver.bin, no SHU ZIP"
          } > SmartESC_G30_BENCH_BUILD_INFO.txt

      # Independent *offline* check of artifact identity; no UART or flash.
      - name: Verify BIN, encrypted UART-IAP and manifest agree
        run: |
          python3 tools/verify_g30_bench_artifacts.py \
            g30p/STM32CubeIDE/Debug/g30p.bin \
            SmartESC_G30_BENCH_IAP_Driver.bin \
            SmartESC_G30_BENCH_MANIFEST.json \
            --json-out SmartESC_G30_BENCH_VERIFY.json

      - name: Upload G30 bench binaries and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: SmartESC-G30-BENCH-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            g30p/STM32CubeIDE/Debug/g30p.bin
            g30p/STM32CubeIDE/Debug/g30p.elf
            g30p/STM32CubeIDE/Debug/g30p.map
            SmartESC_G30_BENCH_IAP_Driver.bin
            SmartESC_G30_BENCH_MANIFEST.json
            SmartESC_G30_BENCH_VERIFY.json
            SmartESC_G30_BENCH_BUILD_INFO.txt

      # Diagnostic artifacts remain available independently of the IAP build.
      - name: Upload G30 SRAM and heap audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G30-SRAM-audit-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            g30-ram-audit.json
            g30-heap-audit.json
